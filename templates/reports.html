{% extends 'base.html' %}
{% block content %}

<body>
    <div class="reports">
        <h1>{{ reports[0] }}</h1>
        <!-- Takes data from database to create unique page for every report -->
        <div class="twocolumn">
            <p>Sight recorded in {{reports[2]}}</p>
            <p>Reported by {{reports[1]}} on {{reports[3]}}</p>
        </div>
        <div class="uploadedimg">
            <img src="{{url_for('static', filename='imageupload/' + reports[4])}}">
        </div>
    </div>
    <div class="srepo">
        <a href="/searchreports">Return to report search</a>
    </div>
</body>

{% endblock %}
