{% extends 'base.html' %}
{% block content %}

<!-- this section is for the report post form -->
<main>
    <div class="two-column-right">
        <div class="report-container">
            <form action="/report" method="post" enctype="multipart/form-data" >
                <h2>Make a Report</h2>
                
                <!-- text boxes for location found-->
                <div class="input-group">
                    <label for="username">Your Username</label>
                    <input type="text" name =username value="{{session['user'][1]}}" required readonly></input>
                </div>

                <div class="input-group">
                    <label for="location">Location Found</label>
                    <input type="text" name="location" required></input>
                </div>

                <!-- date select -->
                <div class="input-group">
                    <label for="date">Date Found</label>
                    <input type="date" name="date" required></input>
                </div>

                <!-- drop down menu for species select -->
                <div class="dropdown">
                    <label for="species">Species</label>
                    <select id="species" name="species" required>
                        <option value="" selected disabled>Select a species</option> <!-- prevents user from not selecting a species -->
                <!-- list of species to select from; takes from database -->
                        {% for specie in species %}
                        <option value="{{specie[0]}}">{{specie[1]}}</option>
                        {% endfor %}
                    </select>
                </div>
                <br>
                <div class="image">
                    <label for="file">Image (optional)</label>
                    <input type="file" id="file" name="file" accept="image/*">
                </div>
                <!-- takes user to species list with pictures incase they don't know the name of what they saw -->
                <div class="redirect">
                    <a href="/speciesfinder">Don't know what species you saw? Check out our photo guide!</a>
                </div>

                <!-- submit button -->
                <br> <br> <br>
                <button type="submit">Submit</button>
            </form>
        </div>
        
        <div class="rimage">
            <img>
        </div>
    </div>
</main>

{% endblock %}
