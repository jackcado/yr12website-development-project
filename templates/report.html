{% extends 'base.html' %}
{% block content %}

<!-- this section is for the report post form -->
<main>
    <div class="report-container">
        {% if session["username"] == "admin" %}
        <form action="/report" method="post">
            <h2>Make a Report</h2>
            
            <!-- text boxes for location found-->
            <!-- <div class="input-group">
                <label for="username">Your Username</label>
                <input type="text" name="username" required></input>
            </div> -->
            <div class="input-group">
                <label for="location">Location Found</label>
                <input type="text" name="location" required></input>
            </div>

            <!-- drop down menu for species select -->
            <div class="dropdown">
                <label for="species">Species</label>
                <select id="species" name="species" required>
                    <option value="" selected disabled>Select a species</option> <!-- prevents user from not selecting a species -->
            <!-- list of species to select from; takes from database -->
                    {% for specie in species %}
                    <option value="{{specie[0]}}">{{specie[1]}}</option>
                    {% endfor %}
                </select>
            </div>
            <!-- takes user to species list with pictures incase they don't know the name of what they saw -->
            <div class="redirect">
                <a href="speciesfinder.html">Don't know what species you saw? Check out our photo guide!</a>
            </div>
            <!-- submit button -->
            <button type="submit">Submit</button>
        </form>
        {% else %}
            <div class="loggedout">
                <p>Please <a href="/login"> log in</a>before reporting!</p>
            </div>
        {% endif %}
    </div>
</main>

{% endblock %}
