{% extends 'base.html' %}
{% block content %}

<main>
    <div class="login-container">
        <form action="/login" method="post">
            <h2>Login</h2>
            <div class="input">
                <label for="username">Username</label>
                <input type="text" id="Username" placeholer="enter here" required></input>
    
                <label for="password">Password</label>
                <input type="text" id="Password" placeholder="enter here" required></input>
            </div>
            <button type="submit">Login</button>

            <div class="Account404">
                <a href="signup">Don't have an account? Sign up here!</a>
            </div>
        </form>
    </div>
</main>

{% endblock %}
